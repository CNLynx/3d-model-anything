name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/house-capture/**'
      - '.github/workflows/ios-ipa.yml'
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apps/house-capture
        run: xcodegen generate
      - name: Build (no signing)
        working-directory: apps/house-capture
        run: |
          xcodebuild -project HouseCapture.xcodeproj -scheme HouseCapture -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        working-directory: apps/house-capture
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HouseCapture.app Payload/
          zip -qry 3DModelAnything-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 3DModelAnything-unsigned-ipa
          path: apps/house-capture/3DModelAnything-unsigned.ipa
          retention-days: 30
